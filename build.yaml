#INFO: This file generates the GitHub Actions matrix.
include:
  - board: nice_nano
    shield: corne_left nice_view_adapter nice_view
    artifact-name: corne_max_left
    snippet: studio-rpc-usb-uart

  - board: nice_nano
    shield: corne_right nice_view_adapter nice_view
    artifact-name: corne_max_right

  - board: nice_nano
    shield: cradio_left
    artifact-name: ferris_left
    snippet: studio-rpc-usb-uart

  - board: nice_nano
    shield: cradio_right
    artifact-name: ferris_right

  # Corne Min — standalone split (left is central)
  - board: corne_min_left
    shield: rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
    artifact-name: corne_min_left_with_studio
  - board: corne_min_right
    shield: rgbled_adapter
    cmake-args: -DCONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
    artifact-name: corne_min_right

  # Prospector dongle for Corne Min (central) + settings reset
  # The shield-name prefix match loads corne.conf for this build, which forces
  # ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y. Override with cmake-args so the dongle
  # uses carrefinho's custom status screen (the choice-default override in the
  # prospector module's Kconfig.defconfig doesn't win against an explicit conf).
  - board: seeeduino_xiao_ble
    shield: corne_min_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
    artifact-name: prospector_for_corne_min
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: prospector_settings_reset

  # Corne Min halves running as peripherals to the prospector dongle
  - board: corne_min_left
    shield: rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_min_left_for_prospector
  - board: corne_min_right
    shield: rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_min_right_for_prospector

  - board: corne_min_left
    shield: settings_reset
    artifact-name: corne_min_settings_reset
