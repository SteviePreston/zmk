#INFO: This sets ZMK Config for Corne Min

# Name, max length is 16 chars
CONFIG_ZMK_KEYBOARD_NAME="Ste Corne Min"

# Turn off RGB circuit
CONFIG_ZMK_RGB_UNDERGLOW=n

# Battery, Soft sleep at 15m, Deep sleep to 30m
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Prospector dongle: pin LCD brightness (no ALS by default)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
