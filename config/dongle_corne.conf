#INFO: Corne BT dongle (nice_nano acting as the split central).
# Matched by the `dongle_corne` shield name only — see the shield's
# Kconfig.defconfig for why the shield is not called `corne_dongle`.
# The halves keep using corne.conf; none of it applies here.

# Bare nice_nano — no Nice!View, the displays live on the two halves.
CONFIG_ZMK_DISPLAY=n

# USB powered and it is the only link the halves have; never sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n

#Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
