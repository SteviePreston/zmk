manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to the last pre-Zephyr-4.1 commit. ZMK main moved to Zephyr 4.1 / HWMv2
      # in c06fa48, which is incompatible with MechboardsLTD/zmk-module's HWMv1 corne_min
      # board and breaks per-board shield overlays for nice_view_adapter on BOARD=nice_nano.
      revision: abb64ba316c29caddc49727ca2cac2f0ed5970c7
      import: app/west.yml
    - name: corne-min-rgbled
      url: https://github.com/MechboardsLTD/zmk-module
      revision: corne-min-rgbled
    - name: corne-min-board
      url: https://github.com/MechboardsLTD/zmk-module
      revision: corne-min
    - name: prospector-zmk-module
      url: https://github.com/carrefinho/prospector-zmk-module
      revision: main
  self:
    path: config
