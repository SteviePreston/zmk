manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to the v0.3 release (Zephyr 3.5 / LVGL 8). Matches beekeeb's known-good
      # prospector reference config. ZMK main (Zephyr 4.1 / HWMv2) is incompatible with
      # MechboardsLTD/zmk-module's HWMv1 corne_min board.
      revision: v0.3
      import: app/west.yml
    - name: corne-min-rgbled
      url: https://github.com/MechboardsLTD/zmk-module
      revision: corne-min-rgbled
    - name: corne-min-board
      url: https://github.com/MechboardsLTD/zmk-module
      revision: corne-min
    - name: prospector-zmk-module
      url: https://github.com/carrefinho/prospector-zmk-module
      revision: main
  self:
    path: config
